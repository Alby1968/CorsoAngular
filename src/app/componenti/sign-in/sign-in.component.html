<h1>Login Utente</h1>
<form #homeform="ngForm" (ngSubmit)="onSubmit(homeform)"> 
  
    
  <mat-form-field>
    <mat-label>Email</mat-label>
    <input matInput type="Email" name="email" ngModel required email/>
  </mat-form-field>

    <br/>
    <mat-form-field>
        <mat-label>Password</mat-label>
        <input matInput type="password" name="password" ngModel required  />
      </mat-form-field>
  
     <br/>   
          
    <button mat-raised-button color="primary" type="submit" [disabled]="!homeform.valid">Login</button>
         
    </form>
